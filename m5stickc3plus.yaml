# ---------------------------------------------------------
# HOME ASSISTANT VOICE ASSIST
# ---------------------------------------------------------

voice_assistant:
  id: va

  microphone:
    microphone: sticks3_microphone
    gain_factor: 4

  # THIS IS REQUIRED
  speaker: sticks3_speaker

  noise_suppression_level: 2
  auto_gain: 31dBFS

  on_start:
    - logger.log: "Voice assistant started"

  on_stt_end:
    - script.stop: va_listen_timeout
    - logger.log:
        format: "Recognised: %s"
        args: ['x.c_str()']

  on_tts_start:
    - script.stop: va_listen_timeout
    - logger.log:
        format: "Response: %s"
        args: ['x.c_str()']

  on_tts_stream_start:
    - logger.log: "TTS stream started"

  on_tts_stream_end:
    - logger.log: "TTS stream ended"

  on_idle:
    - script.stop: va_listen_timeout
    - logger.log: "VOICE ASSISTANT READY"

  on_error:
    - script.stop: va_listen_timeout
    - logger.log:
        format: "Voice assistant error: %s - %s"
        args:
          - 'code.c_str()'
          - 'message.c_str()'

# ---------------------------------------------------------
# BUTTONS
#
# StickS3:
# KEY1 = GPIO11
# KEY2 = GPIO12
# ---------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: push_to_talk
    name: "Push to Talk"

    pin:
      number: GPIO11
      inverted: true
      mode:
        input: true
        pullup: true

    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

    on_press:
      - if:
          condition:
            switch.is_on: microphone_mute
          then:
            - logger.log: "Microphone muted - PTT ignored"
          else:
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - logger.log: "VA busy - cancelling previous session"
                  - voice_assistant.stop:

                  - wait_until:
                      condition:
                        not:
                          voice_assistant.is_running:
                      timeout: 2s

                  - delay: 100ms

            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - logger.log: "PTT pressed - starting fresh session"

                  - voice_assistant.start:
                      silence_detection: true

                  - script.execute: va_listen_timeout

                else:
                  - logger.log: "Voice assistant still busy - start skipped"

    on_release:
      - logger.log: "PTT released"

script:
  - id: va_listen_timeout
    mode: restart
    then:
      - delay: 8s

      - if:
          condition:
            voice_assistant.is_running:
          then:
            - logger.log: "Voice listening timeout - resetting"
            - voice_assistant.stop:

# ---------------------------------------------------------
# MUTE CONTROL
# ---------------------------------------------------------

switch:
  - platform: template
    id: microphone_mute
    name: "Microphone Mute"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

    on_turn_on:
      # - micro_wake_word.stop:
      - voice_assistant.stop:

    # on_turn_off:
      # - micro_wake_word.start: