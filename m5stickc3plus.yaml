substitutions:
  name: m5sticks3-voice
  friendly_name: "M5StickS3 Voice"

globals:
  # Set once the M5PM1 audio rail and amplifier pin are configured
  - id: pm1_amp_ready
    type: bool
    restore_value: no
    initial_value: "false"
  - id: va_screen_state
    type: int
    restore_value: no
    initial_value: '0'

  - id: last_heard
    type: std::string
    restore_value: no
    initial_value: '" "'

  - id: last_error
    type: std::string
    restore_value: no
    initial_value: '" "'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # I2C itself starts at priority 1000.
    # ES8311 uses the normal component priority around 600.
    # So 850 puts the PMIC setup between them.
    - priority: 850
      then:
        - lambda: |-
            ESP_LOGI("sticks3_power", "Initialising M5PM1 audio power");

            // M5PM1 can NAK its first transaction after I2C sleep,
            // so retry reads/writes a few times.
            auto read_reg = [&](uint8_t reg, uint8_t &value) -> bool {
              for (int i = 0; i < 3; i++) {
                auto result = id(m5pm1).read_byte(reg);
                if (result.has_value()) {
                  value = result.value();
                  return true;
                }
                esphome::delay(5);
              }
              return false;
            };

            auto write_reg = [&](uint8_t reg, uint8_t value) -> bool {
              for (int i = 0; i < 3; i++) {
                if (id(m5pm1).write_byte(reg, value)) {
                  return true;
                }
                esphome::delay(5);
              }
              return false;
            };

            auto update_reg =
                [&](uint8_t reg, uint8_t mask, bool set) -> bool {
              uint8_t value;

              if (!read_reg(reg, value)) {
                ESP_LOGE(
                  "sticks3_power",
                  "Unable to read M5PM1 register 0x%02X",
                  reg
                );
                return false;
              }

              if (set) {
                value |= mask;
              } else {
                value &= ~mask;
              }

              if (!write_reg(reg, value)) {
                ESP_LOGE(
                  "sticks3_power",
                  "Unable to write M5PM1 register 0x%02X",
                  reg
                );
                return false;
              }

              return true;
            };

            // Confirm PMIC
            uint8_t device_id = 0;

            if (!read_reg(0x00, device_id)) {
              ESP_LOGE(
                "sticks3_power",
                "M5PM1 did not respond"
              );
              return;
            }

            ESP_LOGI(
              "sticks3_power",
              "M5PM1 detected, ID=0x%02X",
              device_id
            );

            // Disable M5PM1 I2C idle sleep.
            // This is also done by M5Stack's M5PM1::begin().
            write_reg(0x09, 0x00);

            // Disable PMIC watchdog
            write_reg(0x0A, 0x00);

            // -------------------------------------------------
            // PYG2 -> L3B power rail
            //
            // GPIO2 function field = bits 5:4 in GPIO_FUNC0.
            // 00 = ordinary GPIO.
            // -------------------------------------------------

            // GPIO2 -> ordinary GPIO
            if (!update_reg(0x16, 0x30, false)) return;

            // GPIO2 -> output
            if (!update_reg(0x10, 0x04, true)) return;

            // GPIO2 -> push-pull
            if (!update_reg(0x13, 0x04, false)) return;

            // GPIO2 HIGH -> L3B ON
            if (!update_reg(0x11, 0x04, true)) return;

            ESP_LOGI(
              "sticks3_power",
              "L3B enabled - powering ES8311"
            );

            // Give the rail and codec time to stabilise.
            esphome::delay(100);

            // Check that the ES8311 now answers.
            auto codec = id(es8311_probe).read_byte(0x00);

            if (codec.has_value()) {
              ESP_LOGI(
                "sticks3_power",
                "ES8311 now responds at 0x18, REG00=0x%02X",
                codec.value()
              );
            } else {
              ESP_LOGE(
                "sticks3_power",
                "ES8311 still not responding after enabling L3B"
              );
            }

            // -------------------------------------------------
            // Configure PYG3 for the AW8737 speaker amplifier,
            // but leave it OFF until after the codec starts.
            // -------------------------------------------------

            // GPIO3 function field = bits 7:6
            if (!update_reg(0x16, 0xC0, false)) return;

            // GPIO3 -> output
            if (!update_reg(0x10, 0x08, true)) return;

            // GPIO3 -> push-pull
            if (!update_reg(0x13, 0x08, false)) return;

            // Initially amplifier OFF
            if (!update_reg(0x11, 0x08, false)) return;

            id(pm1_amp_ready) = true;

    # This runs after the normal ES8311 setup.
    - priority: 500
      then:
        - lambda: |-
            if (!id(pm1_amp_ready)) {
              ESP_LOGW(
                "sticks3_power",
                "M5PM1 setup incomplete - speaker amplifier not enabled"
              );
              return;
            }

            for (int i = 0; i < 3; i++) {
              auto value = id(m5pm1).read_byte(0x11);
              if (value.has_value() &&
                  id(m5pm1).write_byte(0x11, value.value() | 0x08)) {
                ESP_LOGI(
                  "sticks3_power",
                  "Speaker amplifier enabled"
                );
                return;
              }
              esphome::delay(5);
            }

            ESP_LOGE(
              "sticks3_power",
              "Unable to enable speaker amplifier"
            );

    - priority: -100
      then:
        - audio_dac.set_volume:
            id: es8311_dac
            volume: 80%

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  id: ha_api
  encryption:
    key: !secret ha_api_pw

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "M5StickS3 Fallback"

captive_portal:

network:
  tcp_send_buffer: 32kB

# ---------------------------------------------------------
# I2C
# ES8311 codec and M5PM1 power controller
# ---------------------------------------------------------

i2c:
  id: internal_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz
  scan: true

i2c_device:
  # M5PM1 power-management IC
  - id: m5pm1
    i2c_id: internal_i2c
    address: 0x6E

  # Used only to verify that the codec has powered up
  - id: es8311_probe
    i2c_id: internal_i2c
    address: 0x18

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false


i2s_audio:
  # Microphone controller
  - id: i2s_input

    i2s_lrclk_pin:
      number: GPIO15
      allow_other_uses: true

    i2s_bclk_pin:
      number: GPIO17
      allow_other_uses: true

    i2s_mclk_pin:
      number: GPIO18
      allow_other_uses: true


  # Speaker controller
  - id: i2s_output

    i2s_lrclk_pin:
      number: GPIO15
      allow_other_uses: true

    i2s_bclk_pin:
      number: GPIO17
      allow_other_uses: true

    i2s_mclk_pin:
      number: GPIO18
      allow_other_uses: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    i2c_id: internal_i2c
    use_mclk: true
    use_microphone: false
    sample_rate: 16000
    bits_per_sample: 16bit


microphone:
  - platform: i2s_audio
    id: sticks3_microphone
    i2s_audio_id: i2s_input

    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false

    i2s_mode: primary

    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

    mclk_multiple: 256


speaker:
  - platform: i2s_audio
    id: sticks3_speaker
    i2s_audio_id: i2s_output

    i2s_dout_pin: GPIO14
    dac_type: external
    audio_dac: es8311_dac

    i2s_mode: primary
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

    buffer_duration: 1s
    timeout: 3s

# ---------------------------------------------------------
# HOME ASSISTANT VOICE ASSIST
# ---------------------------------------------------------

voice_assistant:
  id: va

  microphone:
    microphone: sticks3_microphone
    gain_factor: 4

  speaker: sticks3_speaker

  noise_suppression_level: 2
  auto_gain: 31dBFS

  on_listening:
    - lambda: |-
        id(va_screen_state) = 1;
    - component.update: sticks3_display

  on_stt_end:
    - script.stop: va_listen_timeout
    - lambda: |-
        id(last_heard) = x;
        id(va_screen_state) = 2;
    - component.update: sticks3_display

  on_intent_start:
    - lambda: |-
        id(va_screen_state) = 3;
    - component.update: sticks3_display

  on_tts_start:
    - lambda: |-
        id(va_screen_state) = 4;
    - component.update: sticks3_display

  on_error:
    - script.stop: va_listen_timeout
    - lambda: |-
        id(last_error) = code;
        id(va_screen_state) = 5;
    - component.update: sticks3_display

  # on_idle only fires in continuous mode, so use on_end and wait for
  # TTS playback to finish before returning to Ready.
  on_end:
    - script.stop: va_listen_timeout
    - wait_until:
        condition:
          not:
            voice_assistant.is_running:
        timeout: 30s
    - delay: 1500ms
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - lambda: |-
              id(va_screen_state) = 0;
          - component.update: sticks3_display

# ---------------------------------------------------------
# BUTTONS
#
# StickS3:
# KEY1 = GPIO11
# KEY2 = GPIO12
# ---------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: push_to_talk
    name: "Push to Talk"

    pin:
      number: GPIO11
      inverted: true
      mode:
        input: true
        pullup: true

    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

    on_press:
      - if:
          condition:
            switch.is_on: microphone_mute
          then:
            - logger.log: "Microphone muted - PTT ignored"
          else:
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - logger.log: "VA busy - cancelling previous session"
                  - voice_assistant.stop:

                  - wait_until:
                      condition:
                        not:
                          voice_assistant.is_running:
                      timeout: 2s

                  - delay: 100ms

            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - logger.log: "PTT pressed - starting fresh session"

                  - voice_assistant.start:
                      silence_detection: true

                  - script.execute: va_listen_timeout

                else:
                  - logger.log: "Voice assistant still busy - start skipped"

    on_release:
      - logger.log: "PTT released"

script:
  - id: va_listen_timeout
    mode: restart
    then:
      - delay: 8s

      - if:
          condition:
            voice_assistant.is_running:
          then:
            - logger.log: "Voice listening timeout - resetting"
            - voice_assistant.stop:
            - lambda: |-
                id(last_error) = "timeout";
                id(va_screen_state) = 5;
            - component.update: sticks3_display
            - delay: 1500ms
            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - lambda: |-
                      id(va_screen_state) = 0;
                  - component.update: sticks3_display

# ---------------------------------------------------------
# MUTE CONTROL
# ---------------------------------------------------------

switch:
  - platform: template
    id: microphone_mute
    name: "Microphone Mute"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

    on_turn_on:
      - voice_assistant.stop:

spi:
  id: display_spi
  clk_pin: GPIO40
  mosi_pin: GPIO39

output:
  - platform: gpio
    id: lcd_backlight_output
    pin: GPIO38

light:
  - platform: binary
    id: lcd_backlight
    output: lcd_backlight_output
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

  - file: "gfonts://Roboto"
    id: font_large
    size: 26

display:
  - platform: mipi_spi
    id: sticks3_display

    # Use the ESPHome ST7789V driver for the StickS3 ST7789P3
    model: ST7789V

    spi_id: display_spi
    cs_pin: GPIO41
    dc_pin: GPIO45
    reset_pin: GPIO21

    data_rate: 20MHz

    dimensions:
      width: 135
      height: 240
      offset_width: 52
      offset_height: 40

    rotation: 90

    update_interval: never

    invert_colors: true

    lambda: |-
      it.fill(Color(0, 0, 0));

      switch (id(va_screen_state)) {
        case 0:
          // Ready
          it.filled_circle(120, 35, 16, Color(100, 100, 100));
          it.printf(120, 65, id(font_large),
                    TextAlign::TOP_CENTER, "READY");
          break;

        case 1:
          // Listening
          it.filled_circle(120, 35, 16, Color(0, 120, 255));
          it.printf(120, 65, id(font_large),
                    TextAlign::TOP_CENTER, "LISTENING");
          break;

        case 2:
          // STT understood the speech
          it.filled_circle(120, 35, 16, Color(255, 170, 0));
          it.printf(120, 62, id(font_large),
                    TextAlign::TOP_CENTER, "HEARD");

          it.printf(120, 100, id(font_small),
                    TextAlign::TOP_CENTER,
                    "%s",
                    id(last_heard).c_str());
          break;

        case 3:
          // Intent processing
          it.filled_circle(120, 35, 16, Color(255, 170, 0));
          it.printf(120, 65, id(font_large),
                    TextAlign::TOP_CENTER, "THINKING");
          break;

        case 4:
          // Success
          it.filled_circle(120, 35, 16, Color(0, 210, 60));
          it.printf(120, 65, id(font_large),
                    TextAlign::TOP_CENTER, "OK");
          break;

        case 5:
          // Error
          it.filled_circle(120, 35, 16, Color(230, 30, 30));
          it.printf(120, 62, id(font_large),
                    TextAlign::TOP_CENTER, "FAILED");

          it.printf(120, 100, id(font_small),
                    TextAlign::TOP_CENTER,
                    "%s",
                    id(last_error).c_str());
          break;
      }